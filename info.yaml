# OpenSUSI TR-1um MPW project information

# ----------------------------
# Aggregate configuration
# ----------------------------
aggregate:
  top_cell: AGGREGATED_TOP

  pitch:
    x: 2500.0
    y: 2500.0

  grid:
    x: 8
    y: 8

  teg_gds:  users/000_system/GDSII_TEG.gds
  fill_gds: users/000_system/GDSII_FILL.gds

# ----------------------------
# Logo configuration
# ----------------------------
logo:
  dir: logos
  default: OpenSUSI_LOGO.gds

  # substituted in place of any logo whose actual measured bbox exceeds
  # logo.bbox below (a DRC risk, since outer-edge-aligned placement
  # assumes the logo fits within that limit) -- see aggregate_gds.py
  # get_or_load_logo_cell(). Must itself fit within logo.bbox.
  fallback: Default.gds

  # maximum allowed logo bbox (centered origin). A logo file whose actual
  # digitized footprint exceeds this at aggregate time would be a DRC risk
  # (uncontrolled overlap into neighboring geometry) -- it is skipped
  # (not placed) instead of aggregation failing; see aggregate_gds.py
  # get_or_load_logo_cell().
  bbox:
    x: 320.0
    y: 160.0

  # Outer-edge alignment margin (um) from the tile center. Each logo
  # instance's placement is computed from ITS OWN actual measured bbox
  # (read after loading -- different files via map.yaml overrides can
  # have different real sizes) so that the logo's OUTER edge -- the edge
  # nearest the tile boundary -- always lands at this fixed offset,
  # regardless of the logo's actual size:
  #   x_center = sign_x * (placement_outer_margin - actual_bbox_x / 2)
  #   y_center = sign_y * (placement_outer_margin - actual_bbox_y / 2)
  # top_left: sign=(-1,+1) / top_right: sign=(+1,+1) / bottom_right: sign=(+1,-1)
  placement_outer_margin: 1120.0

# ----------------------------
# XY mark configuration
# ----------------------------
xy_mark:
  layer: [13, 0]

  bbox:
    x: 160.0
    y: 110.0

  placement:
    x: -1120.0
    y: -900.0

  text_gds: logos/NUMBERS.gds

  line_pitch: 18.0

  lines:
    - "OPENSUSI"
    - "2026-09"
    - "X{col}-Y{row}"

  # glyph library GDS

# ----------------------------
# Tile-based logo map
# ----------------------------
logo_map: map.yaml